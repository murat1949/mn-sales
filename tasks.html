<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f9b6c">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>MN Sales — Задачи на сегодня</title>
<style>
  :root{
    --mn-green-1:#0f9b6c;
    --mn-green-2:#0a7a56;
    --bg:#f4f6f5;
    --card:#ffffff;
    --ink:#1e293b;
    --ink-light:#64748b;
    --border:#e6eae8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding-bottom:0;
  }
  header{
    background:linear-gradient(135deg, var(--mn-green-1), var(--mn-green-2));
    color:#fff;
    padding:20px 18px 26px;
    border-radius:0 0 20px 20px;
  }
  .logo-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .logo-sq{
    width:34px;height:34px;border-radius:8px;
    background:rgba(255,255,255,0.18);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;letter-spacing:0.5px;
  }
  .brand{font-size:13px;letter-spacing:1.5px;opacity:0.85;text-transform:uppercase;}
  h1{font-size:22px;font-weight:700;margin-bottom:4px;}
  .subtitle{font-size:13px;opacity:0.85;}

  .container{padding:16px;max-width:520px;margin:0 auto;}

  .progress-card{
    background:var(--card);border-radius:16px;border:1px solid var(--border);
    padding:16px;margin-top:-30px;
    box-shadow:0 8px 24px rgba(15,155,108,0.12);
  }
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .progress-num{font-size:20px;font-weight:800;}
  .progress-lbl{font-size:12px;color:var(--ink-light);}
  .progress-bar-bg{height:8px;border-radius:5px;background:var(--bg);overflow:hidden;}
  .progress-bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg, var(--mn-green-1), var(--mn-green-2));transition:width 0.25s ease;}

  .add-row{
    display:flex;gap:8px;margin:16px 0;
  }
  .add-input{
    flex:1;border:1px solid var(--border);border-radius:10px;
    padding:11px 12px;font-size:13px;background:var(--card);
    font-family:inherit;
  }
  .add-btn{
    background:var(--mn-green-1);color:#fff;border:none;border-radius:10px;
    padding:0 18px;font-size:14px;font-weight:700;cursor:pointer;
  }
  .add-btn:disabled{opacity:0.5;}

  .filter-row{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;}
  .filter-chip{
    flex-shrink:0;font-size:12px;font-weight:600;
    padding:6px 12px;border-radius:999px;
    border:1px solid var(--border);background:var(--card);color:var(--ink-light);
    cursor:pointer;white-space:nowrap;
  }
  .filter-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .filter-chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;}
  .dot.lift{background:#f59e0b;}
  .dot.tr{background:#3b82f6;}
  .dot.mn{background:var(--mn-green-1);}
  .dot.cons{background:#a855f7;}

  .tasks{display:flex;flex-direction:column;gap:8px;}
  .task{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;display:flex;align-items:center;gap:11px;cursor:pointer;
  }
  .check{
    width:20px;height:20px;border-radius:6px;border:2px solid var(--border);
    flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:12px;color:#fff;transition:all 0.15s ease;
  }
  .task.done .check{background:var(--mn-green-1);border-color:var(--mn-green-1);}
  .task-body{flex:1;}
  .task-text{font-size:13.5px;font-weight:600;}
  .task.done .task-text{text-decoration:line-through;color:var(--ink-light);}
  .task-proj{font-size:11px;color:var(--ink-light);margin-top:3px;display:flex;align-items:center;gap:5px;}
  .task-del{
    flex-shrink:0;width:24px;height:24px;border-radius:8px;border:1px solid var(--border);
    background:var(--bg);display:flex;align-items:center;justify-content:center;
    font-size:12px;color:#dc2626;
  }
  .empty-hint{padding:14px;font-size:12px;color:var(--ink-light);text-align:center;}

  footer{
    text-align:center;font-size:11px;color:var(--ink-light);
    margin-top:22px;
  }
.bottom-nav{
  position:sticky;bottom:0;
  background:rgba(255,255,255,0.97);
  border-top:1px solid var(--border);
  display:flex;overflow-x:auto;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  gap:2px;
  backdrop-filter:blur(6px);
  z-index:100;
}
.nav-item{
  flex:0 0 auto;min-width:64px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 8px;border-radius:10px;
  text-decoration:none;color:var(--ink-light);
  font-size:9.5px;font-weight:600;
  white-space:nowrap;
}
.nav-item .nav-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
.nav-item .nav-icon svg{width:20px;height:20px;}
.nav-item.active{color:var(--mn-green-1);background:rgba(15,155,108,0.08);}


body{background:var(--bg);}
.app-frame{
  max-width:480px;margin:0 auto;background:#ffffff;
  min-height:100vh;display:flex;flex-direction:column;position:relative;
}
@media (min-width:560px){
  .app-frame{box-shadow:0 0 60px rgba(30,41,59,0.12);}
}
.page-body{flex:1 1 auto;}

</style>
</head>
<body>
<div class="app-frame">

<header>
  <div class="logo-row">
    <div class="logo-sq">MN</div>
    <div class="brand">MN Sales · Продвижение</div>
  </div>
  <h1>Задачи на сегодня</h1>
  <div class="subtitle" id="dateSubtitle"></div>
</header>
<div class="page-body">

<div class="container">

  <div class="progress-card">
    <div class="progress-top">
      <span class="progress-num" id="progressNum">0 / 0</span>
      <span class="progress-lbl">выполнено</span>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <div class="add-row">
    <input class="add-input" id="addInput" placeholder="Новая задача…" />
    <button class="add-btn" id="addBtn">+</button>
  </div>

  <div class="filter-row" id="filterRow"></div>

  <div class="tasks" id="taskList"><div class="empty-hint">Загрузка…</div></div>

</div>

<footer>MN Sales — данные сохраняются в базе</footer>

<script>
const SUPABASE_URL = 'https://swpnpxhoaxcnllieejsn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3cG5weGhvYXhjbmxsaWVlanNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3OTA2OTMsImV4cCI6MjEwMDM2NjY5M30.vpAREIJqgM3SdfqzavSWYJ7uKblcYLdSVZ5iG6KsMc0';

async function sb(path, options = {}) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': options.prefer || 'return=representation',
      ...(options.headers || {})
    }
  });
  if (!res.ok) { console.error(await res.text()); throw new Error('Supabase error ' + res.status); }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

document.getElementById('dateSubtitle').textContent = new Date().toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' });

const projLabels = { lift:'Лифты', tr:'Travel Radar', mn:'MN Systems', cons:'Консалтинг' };
let tasks = [];
let activeFilter = 'all';

const filterRow = document.getElementById('filterRow');
const filters = [{key:'all', label:'Все'}, {key:'lift', label:'Лифты', dot:'lift'}, {key:'tr', label:'Travel Radar', dot:'tr'}, {key:'mn', label:'MN Systems', dot:'mn'}, {key:'cons', label:'Консалтинг', dot:'cons'}];
filters.forEach(f => {
  const chip = document.createElement('div');
  chip.className = 'filter-chip' + (f.key === 'all' ? ' active' : '');
  chip.innerHTML = (f.dot ? `<span class="dot ${f.dot}"></span>` : '') + f.label;
  chip.addEventListener('click', () => {
    activeFilter = f.key;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    render();
  });
  filterRow.appendChild(chip);
});

async function loadTasks(){
  tasks = await sb('mnsales_tasks?select=*&order=created_at.asc');
  render();
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function render(){
  const list = document.getElementById('taskList');
  list.innerHTML = '';
  const visible = tasks.filter(t => activeFilter === 'all' || t.project === activeFilter);

  if (!visible.length) {
    list.innerHTML = '<div class="empty-hint">Пока пусто</div>';
  }

  visible.forEach((t) => {
    const el = document.createElement('div');
    el.className = 'task' + (t.is_done ? ' done' : '');
    el.innerHTML = `
      <div class="check">${t.is_done ? '✓' : ''}</div>
      <div class="task-body">
        <div class="task-text">${escapeHtml(t.title)}</div>
        <div class="task-proj"><span class="dot ${t.project || 'lift'}"></span>${projLabels[t.project] || t.project || ''}</div>
      </div>
      <div class="task-del" data-del="${t.id}">✕</div>
    `;
    el.querySelector('.task-body').addEventListener('click', () => toggleTask(t.id, !t.is_done));
    el.querySelector('.check').addEventListener('click', () => toggleTask(t.id, !t.is_done));
    el.querySelector('[data-del]').addEventListener('click', (e) => { e.stopPropagation(); deleteTask(t.id); });
    list.appendChild(el);
  });

  const total = tasks.length;
  const done = tasks.filter(t => t.is_done).length;
  document.getElementById('progressNum').textContent = done + ' / ' + total;
  document.getElementById('progressFill').style.width = (total ? (done/total*100) : 0) + '%';
}

async function toggleTask(id, isDone){
  await sb('mnsales_tasks?id=eq.' + id, { method:'PATCH', body: JSON.stringify({ is_done: isDone, completed_at: isDone ? new Date().toISOString() : null }) });
  await loadTasks();
}

async function deleteTask(id){
  if (!confirm('Удалить задачу?')) return;
  await sb('mnsales_tasks?id=eq.' + id, { method:'DELETE', prefer:'return=minimal' });
  await loadTasks();
}

document.getElementById('addBtn').addEventListener('click', addTask);
document.getElementById('addInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') addTask(); });

async function addTask(){
  const input = document.getElementById('addInput');
  const val = input.value.trim();
  if (!val) return;
  const btn = document.getElementById('addBtn');
  btn.disabled = true;
  try {
    const proj = activeFilter === 'all' ? 'lift' : activeFilter;
    await sb('mnsales_tasks', { method:'POST', body: JSON.stringify({ title: val, project: proj, is_done: false }) });
    input.value = '';
    await loadTasks();
  } finally {
    btn.disabled = false;
  }
}

loadTasks();
</script>

</div>

<a class="nav-item active" href="tasks.html"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="14" height="14" rx="3.5"/><path d="M6.5 10.3 9 12.8l4.5-5.6"/></svg></span>Задачи</a>

<a class="nav-item" href="notifications.html"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 14.5V9a5 5 0 0 1 10 0v5.5l1.5 2H3.5z"/><path d="M8 17a2 2 0 0 0 4 0"/></svg></span>Алерты</a>
</nav>
</div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' }).then(reg => reg.update()).catch(()=>{});
  });
}
</script>
</body>
