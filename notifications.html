<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f9b6c">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>MN Sales — Уведомления</title>
<style>
  :root{
    --mn-green-1:#0f9b6c;
    --mn-green-2:#0a7a56;
    --bg:#f4f6f5;
    --card:#ffffff;
    --ink:#1e293b;
    --ink-light:#64748b;
    --border:#e6eae8;
    --tg:#229ed9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding-bottom:0;
  }
  header{
    background:linear-gradient(135deg, var(--mn-green-1), var(--mn-green-2));
    color:#fff;
    padding:20px 18px 26px;
    border-radius:0 0 20px 20px;
  }
  .logo-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;justify-content:space-between;}
  .logo-row-left{display:flex;align-items:center;gap:10px;}
  .net-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.2);border-radius:999px;padding:5px 10px;font-size:9.5px;font-weight:700;color:#fff;transition:background .2s,color .2s;flex-shrink:0;}
  .net-dot{width:6px;height:6px;border-radius:50%;background:#baffdb;animation:netPulse 1.8s infinite;}
  .net-pill.offline{background:rgba(255,214,0,0.25);color:#fff3d6;}
  .net-pill.offline .net-dot{background:#FFD600;animation:none;box-shadow:0 0 6px 1px rgba(255,214,0,0.8);}
  @keyframes netPulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .logo-sq{
    width:34px;height:34px;border-radius:8px;
    background:rgba(255,255,255,0.18);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;letter-spacing:0.5px;
  }
  .brand{font-size:13px;letter-spacing:1.5px;opacity:0.85;text-transform:uppercase;}
  h1{font-size:22px;font-weight:700;margin-bottom:4px;}
  .subtitle{font-size:13px;opacity:0.85;}

  .container{padding:16px;max-width:520px;margin:0 auto;}

  .tg-card{
    background:var(--card);border-radius:16px;border:1px solid var(--border);
    padding:14px 16px;margin-top:-30px;
    box-shadow:0 8px 24px rgba(15,155,108,0.12);
    display:flex;align-items:center;gap:12px;
  }
  .tg-icon{
    width:38px;height:38px;border-radius:10px;background:var(--tg);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0;
  }
  .tg-info{flex:1;}
  .tg-name{font-size:13px;font-weight:700;}
  .tg-sub{font-size:11px;color:var(--ink-light);margin-top:2px;}
  .tg-status{
    font-size:11px;font-weight:700;color:var(--mn-green-1);
    background:rgba(15,155,108,0.1);padding:4px 9px;border-radius:999px;
  }

  .section-title{
    font-size:14px;font-weight:700;color:var(--ink);
    margin:20px 0 10px;display:flex;justify-content:space-between;align-items:center;
  }
  .section-title span.hint{font-size:11px;font-weight:500;color:var(--ink-light);}

  .filter-row{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;}
  .filter-chip{
    flex-shrink:0;font-size:12px;font-weight:600;
    padding:6px 12px;border-radius:999px;
    border:1px solid var(--border);background:var(--card);color:var(--ink-light);
    cursor:pointer;white-space:nowrap;
  }
  .filter-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .filter-chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;}
  .dot.tr{background:#3b82f6;}
  .dot.mn{background:var(--mn-green-1);}
  .dot.cons{background:#a855f7;}
  .dot.deal{background:#e0a336;}

  .feed{display:flex;flex-direction:column;gap:8px;}
  .alert{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;display:flex;gap:11px;
  }
  .alert-emoji{font-size:18px;flex-shrink:0;}
  .alert-body{flex:1;}
  .alert-text{font-size:13px;font-weight:600;line-height:1.35;}
  .alert-meta{font-size:11px;color:var(--ink-light);margin-top:4px;display:flex;align-items:center;gap:5px;}
  .alert-time{font-size:10.5px;color:var(--ink-light);white-space:nowrap;flex-shrink:0;}

  footer{
    text-align:center;font-size:11px;color:var(--ink-light);
    margin-top:22px;
  }
.bottom-nav{
  position:sticky;bottom:0;
  background:rgba(255,255,255,0.97);
  border-top:1px solid var(--border);
  display:flex;overflow-x:auto;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  gap:2px;
  backdrop-filter:blur(6px);
  z-index:100;
}
.nav-item{
  flex:0 0 auto;min-width:64px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 8px;border-radius:10px;
  text-decoration:none;color:var(--ink-light);
  font-size:9.5px;font-weight:600;
  white-space:nowrap;
}
.nav-item .nav-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
.nav-item .nav-icon svg{width:20px;height:20px;}
.nav-item.active{color:var(--mn-green-1);background:rgba(15,155,108,0.08);}


body{background:var(--bg);}
.app-frame{
  max-width:480px;margin:0 auto;background:#ffffff;
  min-height:100vh;display:flex;flex-direction:column;position:relative;
}
@media (min-width:560px){
  .app-frame{box-shadow:0 0 60px rgba(30,41,59,0.12);}
}
.page-body{flex:1 1 auto;}

</style>
</head>
<body>
<div class="app-frame">

<header>
  <div class="logo-row">
    <div class="logo-row-left"><div class="logo-sq">MN</div>
    <div class="brand">MN Sales · Продвижение</div></div>
    <span class="net-pill" id="netStatus"><i class="net-dot"></i><span id="netStatusText">ОНЛАЙН</span></span>
  </div>
  <h1>Уведомления</h1>
  <div class="subtitle">Алерты о новых лидах и сделках</div>
</header>
<div class="page-body">

<div class="container">

  <div class="tg-card">
    <div class="tg-icon">✈</div>
    <div class="tg-info">
      <div class="tg-name">Telegram-бот подключён</div>
      <div class="tg-sub">Присылает алерты в реальном времени</div>
    </div>
    <div class="tg-status">Активен</div>
  </div>

  <div class="section-title">Лента <span class="hint">сегодня</span></div>

  <div class="filter-row" id="filterRow"></div>

  <div class="feed" id="feed"></div>

</div>

<footer>MN Sales — прототип, тестовые данные</footer>

<script>
const projLabels = { tr:'Travel Radar', mn:'MN Systems', cons:'Консалтинг' };

const alerts = [
  { emoji:'💰', text:'Новая продажа: клиника заказала MN Systems (клиники)', proj:'mn', kind:'deal', time:'14:32' },
  { emoji:'👤', text:'Новый лид в WhatsApp: логистическая компания из Шымкента', proj:'mn', kind:'lead', time:'13:10' },
  { emoji:'🛒', text:'Продажа на Gumroad: KZ Travel Radar, $1', proj:'tr', kind:'deal', time:'11:47' },
  { emoji:'👤', text:'Заявка на экспресс-сессию с сайта', proj:'cons', kind:'lead', time:'10:22' },
  { emoji:'👤', text:'Новый подписчик написал в директ @kazakhstantravel.guide', proj:'tr', kind:'lead', time:'09:05' },
  { emoji:'💰', text:'Оплата: логистическая компания подтвердила установку', proj:'mn', kind:'deal', time:'08:41' }
];

let activeFilter = 'all';

const filterRow = document.getElementById('filterRow');
const filters = [{key:'all', label:'Все'}, {key:'tr', label:'Travel Radar', dot:'tr'}, {key:'mn', label:'MN Systems', dot:'mn'}, {key:'cons', label:'Консалтинг', dot:'cons'}];
filters.forEach(f => {
  const chip = document.createElement('div');
  chip.className = 'filter-chip' + (f.key === 'all' ? ' active' : '');
  chip.innerHTML = (f.dot ? `<span class="dot ${f.dot}"></span>` : '') + f.label;
  chip.addEventListener('click', () => {
    activeFilter = f.key;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    render();
  });
  filterRow.appendChild(chip);
});

function render(){
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  alerts
    .filter(a => activeFilter === 'all' || a.proj === activeFilter)
    .forEach(a => {
      const el = document.createElement('div');
      el.className = 'alert';
      el.innerHTML = `
        <div class="alert-emoji">${a.emoji}</div>
        <div class="alert-body">
          <div class="alert-text">${a.text}</div>
          <div class="alert-meta"><span class="dot ${a.proj}"></span>${projLabels[a.proj]}</div>
        </div>
        <div class="alert-time">${a.time}</div>
      `;
      feed.appendChild(el);
    });
}
render();
</script>

</div>
<nav class="bottom-nav">
<a class="nav-item" href="overview.html"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 10 3l7 6.5"/><path d="M5 8.5V17h10V8.5"/><path d="M8 17v-5h4v5"/></svg></span>Обзор</a>
<a class="nav-item" href="leads.html"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="10" r="6.3"/><circle cx="10" cy="10" r="3.2"/><circle cx="10" cy="10" r="0.6" fill="currentColor" stroke="none"/></svg></span>Лиды</a>
<a class="nav-item" href="content.html"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="4.2" height="12" rx="1"/><rect x="8.4" y="4" width="4.2" height="8" rx="1"/><rect x="13.8" y="4" width="3.2" height="5" rx="1"/></svg></span>Контент</a>
<a class="nav-item" href="money.html"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="15" height="9.5" rx="2"/><circle cx="10" cy="10.75" r="2.3"/><path d="M2.5 9.2h2M15.5 9.2h2"/></svg></span>Деньги</a>
<a class="nav-item" href="tasks.html"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="14" height="14" rx="3.5"/><path d="M6.5 10.3 9 12.8l4.5-5.6"/></svg></span>Задачи</a>
<a class="nav-item" href="compare.html"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16h5M9 3v13"/><path d="M9 5h7"/><path d="M3 9l2.5-4L8 9M12 9l2.5-4L17 9"/><path d="M3 9c0 1.4 1.1 2.5 2.5 2.5S8 10.4 8 9M12 9c0 1.4 1.1 2.5 2.5 2.5S17 10.4 17 9"/></svg></span>Сравнение</a>
<a class="nav-item active" href="notifications.html"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 14.5V9a5 5 0 0 1 10 0v5.5l1.5 2H3.5z"/><path d="M8 17a2 2 0 0 0 4 0"/></svg></span>Алерты</a>
</nav>
</div>
<script>
function updateNetStatus(){
  const pill = document.getElementById('netStatus');
  const text = document.getElementById('netStatusText');
  if (!pill) return;
  if (navigator.onLine) {
    pill.classList.remove('offline');
    text.textContent = 'ОНЛАЙН';
  } else {
    pill.classList.add('offline');
    text.textContent = 'ОФЛАЙН';
  }
}
window.addEventListener('online', updateNetStatus);
window.addEventListener('offline', updateNetStatus);
document.addEventListener('DOMContentLoaded', updateNetStatus);
if (document.readyState === 'interactive' || document.readyState === 'complete') updateNetStatus();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' }).then(reg => reg.update()).catch(()=>{});
  });
}
</script>
</body>
</html>
