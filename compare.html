<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MN Sales — Сравнение проектов</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --mn-green-1:#0f9b6c;
    --mn-green-2:#0a7a56;
    --bg:#f4f6f5;
    --card:#ffffff;
    --ink:#1e293b;
    --ink-light:#64748b;
    --border:#e6eae8;
    --gold:#e0a336;
    --silver:#94a3b8;
    --bronze:#c58b5c;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding-bottom:40px;
  }
  header{
    background:linear-gradient(135deg, var(--mn-green-1), var(--mn-green-2));
    color:#fff;
    padding:20px 18px 26px;
    border-radius:0 0 20px 20px;
  }
  .logo-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .logo-sq{
    width:34px;height:34px;border-radius:8px;
    background:rgba(255,255,255,0.18);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;letter-spacing:0.5px;
  }
  .brand{font-size:13px;letter-spacing:1.5px;opacity:0.85;text-transform:uppercase;}
  h1{font-size:22px;font-weight:700;margin-bottom:4px;}
  .subtitle{font-size:13px;opacity:0.85;}

  .container{padding:16px;max-width:520px;margin:0 auto;}

  .insight-card{
    background:var(--card);border-radius:16px;border:1px solid var(--border);
    padding:16px;margin-top:-30px;
    box-shadow:0 8px 24px rgba(15,155,108,0.12);
    display:flex;gap:12px;align-items:flex-start;
  }
  .insight-icon{font-size:22px;}
  .insight-text{font-size:13px;line-height:1.45;}
  .insight-text b{color:var(--mn-green-1);}

  .section-title{
    font-size:14px;font-weight:700;color:var(--ink);
    margin:20px 0 10px;
  }

  .rank-list{display:flex;flex-direction:column;gap:8px;}
  .rank-card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:13px 14px;display:flex;align-items:center;gap:12px;
  }
  .medal{
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;color:#fff;flex-shrink:0;
  }
  .medal.g{background:var(--gold);}
  .medal.s{background:var(--silver);}
  .medal.b{background:var(--bronze);}
  .rank-info{flex:1;}
  .rank-name{font-size:13.5px;font-weight:700;}
  .rank-metric{font-size:11.5px;color:var(--ink-light);margin-top:2px;}
  .rank-val{font-size:15px;font-weight:800;color:var(--mn-green-1);text-align:right;}
  .rank-val-lbl{font-size:10px;color:var(--ink-light);text-align:right;margin-top:1px;}

  .chart-card{
    background:var(--card);border-radius:14px;border:1px solid var(--border);
    padding:14px;margin-top:10px;
  }

  footer{
    text-align:center;font-size:11px;color:var(--ink-light);
    margin-top:22px;
  }
</style>
</head>
<body>

<header>
  <div class="logo-row">
    <div class="logo-sq">MN</div>
    <div class="brand">MN Sales · Продвижение</div>
  </div>
  <h1>Сравнение проектов</h1>
  <div class="subtitle">Что окупает вложенное время лучше всего</div>
</header>

<div class="container">

  <div class="insight-card">
    <div class="insight-icon">💡</div>
    <div class="insight-text" id="insightText"></div>
  </div>

  <div class="section-title">Деньги на единицу контента</div>
  <div class="rank-list" id="rankList"></div>

  <div class="section-title">Воронка: лиды → сделки, по проектам</div>
  <div class="chart-card">
    <canvas id="compareChart" height="200"></canvas>
  </div>

</div>

<footer>MN Sales — прототип, тестовые данные</footer>

<script>
const projLabels = { mn:'MN Systems', tr:'Travel Radar', cons:'Консалтинг' };

// ---- тестовые данные ----
const stats = {
  mn:   { moneyMonth: 610000, content: 6,  leads: 35, deals: 4 },
  cons: { moneyMonth: 60000,  content: 9,  leads: 11, deals: 1 },
  tr:   { moneyMonth: 9000 * 470 /*условно в тенге по $9000... на самом деле $9*/, content: 18, leads: 17, deals: 2 }
};
// Travel Radar считаем в $ отдельно для эффективности, чтобы не путать порядки величин
stats.tr.moneyMonth = 9 * 470; // 9 продаж по $1, условная конвертация

const efficiency = Object.keys(stats).map(key => ({
  key,
  perContent: Math.round(stats[key].moneyMonth / stats[key].content)
})).sort((a,b) => b.perContent - a.perContent);

const medals = ['g','s','b'];
const rankList = document.getElementById('rankList');
efficiency.forEach((row, i) => {
  const s = stats[row.key];
  const el = document.createElement('div');
  el.className = 'rank-card';
  el.innerHTML = `
    <div class="medal ${medals[i]}">${i+1}</div>
    <div class="rank-info">
      <div class="rank-name">${projLabels[row.key]}</div>
      <div class="rank-metric">${s.content} единиц контента · ${s.deals} сделки за месяц</div>
    </div>
    <div>
      <div class="rank-val">${row.perContent.toLocaleString('ru-RU')} ₸</div>
      <div class="rank-val-lbl">на 1 контент</div>
    </div>
  `;
  rankList.appendChild(el);
});

const leader = projLabels[efficiency[0].key];
document.getElementById('insightText').innerHTML =
  `Сейчас <b>${leader}</b> приносит больше всего денег на каждую единицу опубликованного контента. ` +
  `Если нужно быстрее выйти на реальные продажи — есть смысл временно сместить фокус контента в его сторону.`;

new Chart(document.getElementById('compareChart'), {
  type:'bar',
  data:{
    labels: Object.values(projLabels),
    datasets:[
      { label:'Лиды', data:[stats.mn.leads, stats.tr.leads, stats.cons.leads], backgroundColor:'#94a3b8' },
      { label:'Сделки', data:[stats.mn.deals, stats.tr.deals, stats.cons.deals], backgroundColor:'#0f9b6c' }
    ]
  },
  options:{
    responsive:true,
    plugins:{ legend:{ position:'bottom', labels:{ font:{ size:10 }, boxWidth:10 } } },
    scales:{
      x:{ ticks:{ font:{ size:10.5 } } },
      y:{ ticks:{ font:{ size:10 } } }
    }
  }
});
</script>

</body>
</html>
