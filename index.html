<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f9b6c">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>MN Sales — Контроль продаж</title>
<style>
  :root{
    --navy:#12253f;
    --mn-green-1:#0f9b6c;
    --mn-green-2:#0a7a56;
    --bg-top:#eef1f4;
    --bg-bot:#e4e9ec;
    --ink-light:#5b6774;
    --border:#e6eae8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background:linear-gradient(180deg, var(--bg-top), var(--bg-bot));
    color:var(--navy);
  }
  .app-frame{max-width:480px;margin:0 auto;background:transparent;min-height:100vh;position:relative;}
  @media (min-width:560px){ .app-frame{box-shadow:0 0 60px rgba(30,41,59,0.12);} }

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 20px 6px;}
  .brand-row{display:flex;align-items:center;gap:10px;}
  .hex-logo{width:44px;height:44px;flex-shrink:0;}
  .brand-text .t1{font-size:20px;font-weight:800;color:var(--navy);line-height:1.1;}
  .brand-text .t2{font-size:11px;font-weight:700;color:var(--mn-green-1);letter-spacing:1.2px;}

  .net-pill{display:inline-flex;align-items:center;gap:6px;background:#ffffff;border:1px solid var(--border);
    border-radius:999px;padding:8px 13px;font-size:10.5px;font-weight:700;color:var(--mn-green-2);
    box-shadow:0 4px 14px rgba(15,41,63,0.08);transition:background .2s,color .2s,border-color .2s;}
  .net-dot{width:6px;height:6px;border-radius:50%;background:var(--mn-green-1);animation:netPulse 1.8s infinite;}
  .net-pill.offline{color:#a5720a;border-color:#f3d68a;background:#fff8e8;}
  .net-pill.offline .net-dot{background:#e0a336;animation:none;box-shadow:0 0 6px 1px rgba(224,163,54,0.7);}
  @keyframes netPulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  .hero-text{padding:18px 22px 0;}
  h1{font-size:42px;line-height:1.05;font-weight:800;color:var(--navy);}
  h1 .accent{color:var(--mn-green-1);display:block;}
  .subtitle{margin-top:16px;font-size:15.5px;line-height:1.5;color:var(--ink-light);max-width:340px;}
  .underline{width:60px;height:3px;background:var(--mn-green-1);border-radius:2px;margin:18px 0 20px;}

  .cta-btn{
    display:inline-flex;align-items:center;gap:12px;
    background:linear-gradient(135deg, var(--mn-green-1), var(--mn-green-2));
    color:#fff;text-decoration:none;font-size:16px;font-weight:700;
    padding:14px 10px 14px 24px;border-radius:999px;
    box-shadow:0 10px 24px rgba(15,155,108,0.3);
  }
  .cta-btn .arrow-circle{
    width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.22);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }

  .hero-img-wrap{margin-top:26px;position:relative;}
  .hero-img-wrap img{width:100%;display:block;}

  .install-wrap{padding:0 22px;margin-top:-6px;margin-bottom:6px;}
  .install-btn{display:none;align-items:center;gap:8px;background:#ffffff;border:1px solid var(--border);
    color:var(--navy);border-radius:10px;padding:10px 14px;font-size:12.5px;font-weight:700;cursor:pointer;
    font-family:inherit;box-shadow:0 4px 14px rgba(15,41,63,0.06);}
  .install-btn.show{display:inline-flex;}
  .install-help{display:none;font-size:11px;color:var(--ink-light);margin-top:8px;line-height:1.4;padding:0 4px;}
  .install-help.show{display:block;}

  .features{
    background:var(--navy);padding:26px 18px 34px;margin-top:10px;
    display:flex;flex-wrap:wrap;
  }
  .feature{text-align:center;width:50%;padding:0 6px;margin-bottom:24px;}
  .feature .ic{
    width:44px;height:44px;border-radius:50%;margin:0 auto 8px;
    display:flex;align-items:center;justify-content:center;
  }
  .feature .lbl{font-size:12px;color:#e7ecf1;line-height:1.35;font-weight:600;}

  footer.pagefoot{text-align:center;font-size:11px;color:var(--ink-light);padding:16px 20px 28px;}
</style>
</head>
<body>
<div class="app-frame">

  <div class="topbar">
    <div class="brand-row">
      <svg class="hex-logo" viewBox="0 0 48 48" fill="none">
        <path d="M24 3 L42 13.5 V34.5 L24 45 L6 34.5 V13.5 Z" stroke="#0f9b6c" stroke-width="2.6"/>
        <circle cx="24" cy="24" r="6" fill="#0f9b6c"/>
      </svg>
      <div class="brand-text">
        <div class="t1">MN Systems</div>
        <div class="t2">PRODUCTION</div>
      </div>
    </div>
    <span class="net-pill" id="netStatus"><i class="net-dot"></i><span id="netStatusText">ОНЛАЙН</span></span>
  </div>

  <div class="hero-text">
    <h1>Контроль<span class="accent">продаж</span></h1>
    <div class="subtitle">Единая система для управления всем циклом продаж и увеличения результата</div>
    <div class="underline"></div>
    <a class="cta-btn" href="overview.html">
      Открыть панель
      <span class="arrow-circle">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M4 10h12M11 5l5 5-5 5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </a>
  </div>

  <div class="hero-img-wrap">
    <img src="images/hero-phone.png" alt="MN Sales — панель продаж">
  </div>

  <div class="install-wrap">
    <button class="install-btn" id="installApp"><span>📲</span><span>Установить на телефон</span></button>
    <div class="install-help" id="installHelp"></div>
  </div>

  <div class="features">
    <div class="feature">
      <div class="ic" style="background:rgba(15,155,108,0.18);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3ad9a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.8" fill="#3ad9a8"/></svg>
      </div>
      <div class="lbl">Все лиды<br>под контролем</div>
    </div>
    <div class="feature">
      <div class="ic" style="background:rgba(59,130,246,0.18);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M6 20v-6M12 20V9M18 20v-11"/></svg>
      </div>
      <div class="lbl">Каждый этап<br>на виду</div>
    </div>
    <div class="feature">
      <div class="ic" style="background:rgba(245,158,11,0.18);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f5b040" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12l2.5 2.5L16 9"/><path d="M3 8l4-3 3 2h4l3-2 4 3-3 3-2-1-2 2h-4l-2-2-2 1z"/></svg>
      </div>
      <div class="lbl">Ни одна сделка<br>не потеряется</div>
    </div>
    <div class="feature">
      <div class="ic" style="background:rgba(168,85,247,0.18);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a2 2 0 0 0 2 3M16 6h3a2 2 0 0 1-2 3"/><path d="M12 13v4M9 20h6M10 17h4"/></svg>
      </div>
      <div class="lbl">Больше сделок —<br>больше результат</div>
    </div>
  </div>

  <footer class="pagefoot">MN Sales · работает и без интернета</footer>
</div>

<script>
function updateNetStatus(){
  const pill = document.getElementById('netStatus');
  const text = document.getElementById('netStatusText');
  if (!pill) return;
  if (navigator.onLine) {
    pill.classList.remove('offline');
    text.textContent = 'ОНЛАЙН';
  } else {
    pill.classList.add('offline');
    text.textContent = 'ОФЛАЙН — из кэша';
  }
}
window.addEventListener('online', updateNetStatus);
window.addEventListener('offline', updateNetStatus);
document.addEventListener('DOMContentLoaded', updateNetStatus);
if (document.readyState === 'interactive' || document.readyState === 'complete') updateNetStatus();
</script>
<script src="pwa-install.js"></script>
</body>
</html>
