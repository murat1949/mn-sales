<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MN Sales — Обзор</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --mn-green-1:#0f9b6c;
    --mn-green-2:#0a7a56;
    --bg:#f4f6f5;
    --card:#ffffff;
    --ink:#1e293b;
    --ink-light:#64748b;
    --border:#e6eae8;
    --red:#e2574c;
    --amber:#e0a336;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding-bottom:0;
  }
  header{
    background:linear-gradient(135deg, var(--mn-green-1), var(--mn-green-2));
    color:#fff;
    padding:20px 18px 26px;
    border-radius:0 0 20px 20px;
  }
  .logo-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .logo-sq{
    width:34px;height:34px;border-radius:8px;
    background:rgba(255,255,255,0.18);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;letter-spacing:0.5px;
  }
  .brand{font-size:13px;letter-spacing:1.5px;opacity:0.85;text-transform:uppercase;}
  h1{font-size:22px;font-weight:700;margin-bottom:4px;}
  .subtitle{font-size:13px;opacity:0.85;}

  .container{padding:16px;max-width:520px;margin:0 auto;}

  .money-card{
    background:var(--card);
    border-radius:16px;
    padding:18px;
    margin-top:-30px;
    box-shadow:0 8px 24px rgba(15,155,108,0.12);
    border:1px solid var(--border);
  }
  .money-total{font-size:30px;font-weight:800;color:var(--ink);}
  .money-label{font-size:12px;color:var(--ink-light);margin-top:2px;}
  .money-split{display:flex;gap:10px;margin-top:14px;}
  .money-item{flex:1;background:var(--bg);border-radius:12px;padding:10px 12px;}
  .money-item .val{font-size:15px;font-weight:700;}
  .money-item .lbl{font-size:11px;color:var(--ink-light);margin-top:2px;}

  .section-title{
    font-size:14px;font-weight:700;color:var(--ink);
    margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;
  }
  .section-title span.hint{font-size:11px;font-weight:500;color:var(--ink-light);}

  .today-list{background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden;}
  .today-item{
    display:flex;align-items:center;gap:10px;
    padding:12px 14px;border-bottom:1px solid var(--border);
    font-size:13.5px;
  }
  .today-item:last-child{border-bottom:none;}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot.green{background:var(--mn-green-1);}
  .dot.amber{background:var(--amber);}
  .dot.red{background:var(--red);}
  .today-item .proj{font-size:10.5px;color:var(--ink-light);margin-left:auto;white-space:nowrap;padding-left:8px;}

  .chart-card{
    background:var(--card);border-radius:14px;border:1px solid var(--border);
    padding:14px;margin-top:10px;
  }

  .proj-cards{display:flex;flex-direction:column;gap:10px;}
  .proj-card{
    background:var(--card);border-radius:14px;border:1px solid var(--border);
    padding:14px;display:flex;align-items:center;gap:12px;
  }
  .proj-dot{width:10px;height:44px;border-radius:5px;flex-shrink:0;}
  .proj-dot.tr{background:#3b82f6;}
  .proj-dot.mn{background:var(--mn-green-1);}
  .proj-dot.cons{background:#a855f7;}
  .proj-info{flex:1;}
  .proj-name{font-size:13.5px;font-weight:700;}
  .proj-metric{font-size:11.5px;color:var(--ink-light);margin-top:2px;}
  .proj-money{font-size:15px;font-weight:800;text-align:right;}

  footer{
    text-align:center;font-size:11px;color:var(--ink-light);
    margin-top:26px;
  }
.bottom-nav{
  position:sticky;bottom:0;
  background:rgba(255,255,255,0.97);
  border-top:1px solid var(--border);
  display:flex;overflow-x:auto;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  gap:2px;
  backdrop-filter:blur(6px);
  z-index:100;
}
.nav-item{
  flex:0 0 auto;min-width:64px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 8px;border-radius:10px;
  text-decoration:none;color:var(--ink-light);
  font-size:9.5px;font-weight:600;
  white-space:nowrap;
}
.nav-item .nav-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
.nav-item .nav-icon svg{width:20px;height:20px;}
.nav-item.active{color:var(--mn-green-1);background:rgba(15,155,108,0.08);}


body{background:var(--bg);}
.app-frame{
  max-width:480px;margin:0 auto;background:#ffffff;
  min-height:100vh;display:flex;flex-direction:column;position:relative;
}
@media (min-width:560px){
  .app-frame{box-shadow:0 0 60px rgba(30,41,59,0.12);}
}
.page-body{flex:1 1 auto;}

</style>
</head>
<body>
<div class="app-frame">

<header>
  <div class="logo-row">
    <div class="logo-sq">MN</div>
    <div class="brand">MN Sales · Продвижение</div>
  </div>
  <h1>Обзор</h1>
  <div class="subtitle">Пятница, 31 июля — за неделю по всем проектам</div>
</header>
<div class="page-body">

<div class="container">

  <div class="money-card">
    <div class="money-total" id="totalMoney">—</div>
    <div class="money-label">Пришло за 7 дней, все проекты</div>
    <div class="money-split" id="moneySplit"></div>
  </div>

  <div class="section-title">Сделать сегодня <span class="hint">3 задачи</span></div>
  <div class="today-list" id="todayList"></div>

  <div class="section-title">Деньги по неделям</div>
  <div class="chart-card">
    <canvas id="moneyChart" height="160"></canvas>
  </div>

  <div class="section-title">Проекты</div>
  <div class="proj-cards" id="projCards"></div>

</div>

<footer>MN Sales — прототип, тестовые данные</footer>

<script>
// ---- тестовые данные ----
const projects = [
  {key:'tr',   name:'KZ Travel Radar', dotClass:'tr',   money7:4, metric:'2 продажи на Gumroad'},
  {key:'mn',   name:'MN Systems',      dotClass:'mn',   money7:150000, metric:'6 тёплых контактов в WhatsApp'},
  {key:'cons', name:'Консалтинг',      dotClass:'cons', money7:0, metric:'1 экспресс-сессия назначена'}
];

const todayTasks = [
  {text:'10 контактов клиникам Алматы (WhatsApp)', dot:'green', proj:'MN Systems'},
  {text:'Смонтировать видео по Кок-Тобе', dot:'amber', proj:'Travel Radar'},
  {text:'Ответить на 2 заявки с сайта', dot:'red', proj:'Консалтинг'}
];

const weeklyMoney = {
  labels:['5 недель назад','4 недели назад','3 недели назад','2 недели назад','Прошлая неделя','Эта неделя'],
  mn:   [80000, 95000, 110000, 130000, 140000, 150000],
  tr:   [1, 2, 3, 2, 5, 4],
  cons: [0, 0, 0, 0, 0, 0]
};

// ---- рендер ----
function formatTenge(v){ return v.toLocaleString('ru-RU') + ' ₸'; }
function formatDollar(v){ return '$' + v; }

const totalTenge = projects.find(p=>p.key==='mn').money7;
document.getElementById('totalMoney').textContent = formatTenge(totalTenge) + ' + ' + formatDollar(projects.find(p=>p.key==='tr').money7);

const moneySplit = document.getElementById('moneySplit');
projects.forEach(p=>{
  const div = document.createElement('div');
  div.className='money-item';
  const val = p.key==='tr' ? formatDollar(p.money7) : formatTenge(p.money7);
  div.innerHTML = `<div class="val">${val}</div><div class="lbl">${p.name}</div>`;
  moneySplit.appendChild(div);
});

const todayList = document.getElementById('todayList');
todayTasks.forEach(t=>{
  const div = document.createElement('div');
  div.className='today-item';
  div.innerHTML = `<span class="dot ${t.dot}"></span><span>${t.text}</span><span class="proj">${t.proj}</span>`;
  todayList.appendChild(div);
});

const projCards = document.getElementById('projCards');
projects.forEach(p=>{
  const div = document.createElement('div');
  div.className='proj-card';
  const val = p.key==='tr' ? formatDollar(p.money7) : formatTenge(p.money7);
  div.innerHTML = `
    <div class="proj-dot ${p.dotClass}"></div>
    <div class="proj-info">
      <div class="proj-name">${p.name}</div>
      <div class="proj-metric">${p.metric}</div>
    </div>
    <div class="proj-money">${val}</div>
  `;
  projCards.appendChild(div);
});

new Chart(document.getElementById('moneyChart'), {
  type:'line',
  data:{
    labels: weeklyMoney.labels,
    datasets:[{
      label:'MN Systems (₸)',
      data: weeklyMoney.mn,
      borderColor:'#0f9b6c',
      backgroundColor:'rgba(15,155,108,0.08)',
      tension:0.35,
      fill:true,
      pointRadius:3
    }]
  },
  options:{
    responsive:true,
    plugins:{ legend:{ display:false } },
    scales:{
      x:{ ticks:{ font:{ size:10 } } },
      y:{ ticks:{ font:{ size:10 }, callback:v=>v/1000+'к' } }
    }
  }
});
</script>

</div>

<a class="nav-item" href="leads.html"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="10" r="6.3"/><circle cx="10" cy="10" r="3.2"/><circle cx="10" cy="10" r="0.6" fill="currentColor" stroke="none"/></svg></span>Лиды</a>
<a class="nav-item" href="content.html"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="4.2" height="12" rx="1"/><rect x="8.4" y="4" width="4.2" height="8" rx="1"/><rect x="13.8" y="4" width="3.2" height="5" rx="1"/></svg></span>Контент</a>
<a class="nav-item" href="money.html"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="15" height="9.5" rx="2"/><circle cx="10" cy="10.75" r="2.3"/><path d="M2.5 9.2h2M15.5 9.2h2"/></svg></span>Деньги</a>
<a class="nav-item" href="tasks.html"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="14" height="14" rx="3.5"/><path d="M6.5 10.3 9 12.8l4.5-5.6"/></svg></span>Задачи</a>
<a class="nav-item" href="compare.html"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16h5M9 3v13"/><path d="M9 5h7"/><path d="M3 9l2.5-4L8 9M12 9l2.5-4L17 9"/><path d="M3 9c0 1.4 1.1 2.5 2.5 2.5S8 10.4 8 9M12 9c0 1.4 1.1 2.5 2.5 2.5S17 10.4 17 9"/></svg></span>Сравнение</a>
<a class="nav-item" href="notifications.html"><span class="nav-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 14.5V9a5 5 0 0 1 10 0v5.5l1.5 2H3.5z"/><path d="M8 17a2 2 0 0 0 4 0"/></svg></span>Алерты</a>
</nav>
</div>
</body>
</html>
